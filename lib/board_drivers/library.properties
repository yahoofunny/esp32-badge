sentence=Display, touch and I2C support for the Waveshare ESP32-S3-Touch-LCD-1.85B.
paragraph=Drives the ST77916 360x360 QSPI panel and the CST816S touch controller. Adds LCD_pushFull/LCD_pushBand/LCD_waitTrans on top of Waveshare's original driver: the stock LCD_addWindow() byte-swaps the caller's buffer in place, which makes it unusable for a renderer that keeps a persistent framebuffer, and it ignores that the pixel transfer is queued asynchronously.
